<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SBMM OU1 — XRF Field Data Viewer</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="#/" class="brand-link"><span class="logo">XRF</span><span class="brand-text">SBMM OU1 Field Data</span></a>
  </div>
  <nav class="topnav">
    <a href="#/" data-route="home">Areas</a>
    <a href="#/verification" data-route="verification">Verification</a>
    <a href="#/field-log" data-route="field-log">Field Log</a>
    <a href="#/reconcile" data-route="reconcile">Reconcile</a>
    <a href="#/export" data-route="export">Export CSV</a>
  </nav>
  <div class="search">
    <input id="globalSearch" type="search" placeholder="Search sample ID, boulder, rdg #..." autocomplete="off" />
    <div id="searchResults" class="search-results"></div>
  </div>
</header>

<div id="elementBar" class="element-bar"></div>

<main id="view"></main>

<footer class="footer">
  <span id="metaInfo"></span>
  <a href="https://github.com/engr-sharif/xrf" target="_blank" rel="noopener">repo</a>
</footer>

<div id="loading" class="loading">Loading data…</div>

<script src="js/app.js" defer></script>

</html>
