name: Rebuild data.json and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Don't loop when the workflow's own auto-commit lands.
    paths-ignore:
      - 'site/data/data.json'
      - 'site/data/*.csv'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a real token to push back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install openpyxl

      - name: Build site data
        run: python scripts/build_data.py

      - name: Commit regenerated data.json + CSVs (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/data.json site/data/SBM-XRF-*.csv
          if git diff --staged --quiet; then
            echo "site/data is unchanged"
          else
            git commit -m "Auto-rebuild site/data from XLSX + CSVs [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
